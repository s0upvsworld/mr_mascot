<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9bc;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .email-header {
            text-align: center;
            margin-bottom: 10px;
            background-color: #002e72;
            padding: 1px;
            font-size: 0.8em;
            color: #f9f9f9;
            border: 3px solid #ff5810d1;
        }
        .email-body {
            margin-bottom: 20px;
        }
        .email-footer {
            text-align: center;
            font-size: 0.9em;
            color: #777;
        }
        .email-footer p {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #002e72;
            margin: 20px 0;
        }
        @media (max-width: 600px) {
            .email-container {
                padding: 10px;
                border: 2px solid #ddd;
                border-radius: 5px;
                background-color: #f9f9f9;
            }
            .email-header {
                font-size: 0.8em;
                padding: 1px;
                background-color: #002D72;
                color: #f9f9f9;
                border: 1px solid #d3d3d3;
            }
            .email-body {
                font-size: 1em;
                color: #333;
            }
            .email-footer {
                font-size: 0.8em;
                color: #777;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1>Mets Win! PHI: 5 | NYM: 6</h1>
        </div>
        <div class="email-body">
            <p>{{ body }}</p>
        </div>
        <hr>
        <div class="email-footer">
            <p>
                <a href="mailto:mrmet.alerts@gmail.com?subject=unsubscribe&body=unsubscribe">Unsubscribe</a> 
            </p>
            <p>
                <a href="mailto:kenfleckenstein@gmail.com">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Mail_%28iOS%29.svg" alt="Email" style="width:25px;height:25px;margin-right:10px;">
                </a>
                <a href="https://github.com/s0upvsworld/mr_mascot" target="_blank">
                    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" style="width:25px;height:25px;">
                </a>
            </p>
        </div>
    </div>
</body>
</html>
